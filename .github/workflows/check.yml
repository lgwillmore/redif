name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call: # the Release workflow runs these checks before publishing

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint Kotlin
        run: ./gradlew ktfmtCheck
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest Redis, and the oldest redif supports.
        redis: [ "8.2.1", "7.0" ]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Start Redis
        run: docker compose up -d --wait
        env:
          REDIF_TEST_REDIS_VERSION: ${{ matrix.redis }}
      - name: Test with Gradle
        run: ./gradlew test
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Test Results (Redis ${{ matrix.redis }})
          files: |
            */build/test-results/**/*.xml
